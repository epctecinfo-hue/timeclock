<style>
  :root {
    --brand-navy: #0a3b55;
    --brand-navy-dark: #062a3d;
    --brand-teal: #14b8a6;
    --brand-teal-dark: #0d9488;
    --success: #10b981;
    --danger: #dc2626;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; -webkit-tap-highlight-color: transparent; }
  html, body { height: 100%; }
  body {
    font-family: -apple-system, BlinkMacSystemFont, 'Segoe UI', Arial, sans-serif;
    background: linear-gradient(180deg, var(--brand-navy) 0%, var(--brand-navy-dark) 100%);
    color: #1f2937;
    min-height: 100vh;
    padding: 16px;
    display: flex;
    flex-direction: column;
    align-items: center;
  }
  .app { width: 100%; max-width: 420px; }
  header { text-align: center; color: white; margin-bottom: 16px; padding-top: 6px; }
  .logo { height: 48px; margin: 0 auto 10px; display: block; filter: drop-shadow(0 2px 8px rgba(0,0,0,0.25)); }
  .greeting { font-size: 13px; opacity: 0.9; margin-bottom: 2px; color: var(--brand-teal); font-weight: 600; }
  .employee-name { font-size: 24px; font-weight: 700; margin-bottom: 3px; }
  .date { font-size: 13px; opacity: 0.85; }
  .status-card { background: white; border-radius: 16px; padding: 14px 16px; box-shadow: 0 4px 20px rgba(0,0,0,0.15); margin-bottom: 12px; }
  .status-card h3 { font-size: 12px; color: #6b7280; margin-bottom: 8px; font-weight: 600; letter-spacing: 0.3px; display: flex; justify-content: space-between; align-items: center; }
  .status-card h3 .total { color: var(--brand-teal-dark); font-weight: 700; font-size: 13px; direction: ltr; }
  .session-list { display: flex; flex-direction: column; gap: 5px; }
  .session { display: flex; justify-content: space-between; align-items: center; padding: 9px 11px; background: #f9fafb; border-radius: 10px; border-right: 3px solid #d1d5db; font-size: 13px; }
  .session.open { border-right-color: var(--brand-teal); background: #f0fdfa; }
  .session.closed { border-right-color: var(--brand-navy); }
  .session-times { display: flex; gap: 6px; align-items: center; direction: ltr; font-variant-numeric: tabular-nums; }
  .session-times .arrow { color: #9ca3af; }
  .session-hours { font-weight: 600; color: var(--brand-navy); font-size: 12px; }
  .session-status-pill { background: var(--brand-teal); color: white; padding: 2px 8px; border-radius: 10px; font-size: 10px; font-weight: 600; }
  .empty-state { text-align: center; color: #9ca3af; font-size: 13px; padding: 12px 0; }
  .special-banner { background: #fef3c7; color: #92400e; padding: 9px; border-radius: 10px; text-align: center; margin-top: 8px; font-size: 13px; font-weight: 600; }
  .button-stack { display: flex; flex-direction: column; gap: 10px; margin-bottom: 12px; }
  .big-btn { width: 100%; padding: 20px; border: none; border-radius: 16px; font-size: 19px; font-weight: 700; font-family: inherit; cursor: pointer; box-shadow: 0 4px 14px rgba(0,0,0,0.2); transition: transform 0.1s, opacity 0.2s; color: white; }
  .big-btn:active { transform: scale(0.97); }
  .big-btn:disabled { opacity: 0.4; cursor: not-allowed; }
  .btn-in { background: var(--brand-teal); }
  .btn-out { background: var(--danger); }
  .secondary-row { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; margin-bottom: 4px; }
  .small-btn { background: rgba(255,255,255,0.95); color: var(--brand-navy); padding: 12px 8px; border: none; border-radius: 10px; font-size: 12px; font-weight: 600; font-family: inherit; cursor: pointer; text-align: center; }
  .small-btn:active { transform: scale(0.98); }
  .footer { text-align: center; margin-top: 14px; color: rgba(255,255,255,0.75); font-size: 11px; }
  .footer button { background: none; border: none; color: white; font-size: 11px; cursor: pointer; text-decoration: underline; font-family: inherit; }
  .overlay { position: fixed; inset: 0; background: rgba(0,0,0,0.55); display: none; align-items: flex-end; justify-content: center; z-index: 100; padding: 16px; }
  .overlay.show { display: flex; }
  .modal { background: white; border-radius: 20px; padding: 22px; width: 100%; max-width: 420px; margin-bottom: 14px; animation: slideUp 0.2s; }
  @keyframes slideUp { from { transform: translateY(40px); opacity: 0; } to { transform: translateY(0); opacity: 1; } }
  .modal h2 { font-size: 19px; margin-bottom: 14px; text-align: center; color: var(--brand-navy); }
  .modal-options { display: flex; flex-direction: column; gap: 8px; margin-bottom: 14px; }
  .opt-btn { padding: 16px; border: 2px solid #e5e7eb; border-radius: 12px; background: white; font-size: 16px; font-weight: 600; font-family: inherit; cursor: pointer; text-align: right; color: #374151; }
  .opt-btn:active { background: #f3f4f6; }
  .opt-cancel { width: 100%; padding: 12px; border: none; border-radius: 10px; background: #f3f4f6; font-size: 14px; font-family: inherit; cursor: pointer; color: #6b7280; }
  .time-confirm-input { width: 100%; padding: 14px; border: 2px solid #d1d5db; border-radius: 12px; font-size: 28px; font-family: inherit; text-align: center; direction: ltr; margin: 14px 0; font-variant-numeric: tabular-nums; }
  .field-label { font-size: 13px; color: #4b5563; margin-bottom: 4px; margin-top: 10px; font-weight: 600; }
  .field-input { width: 100%; padding: 12px 14px; border: 2px solid #d1d5db; border-radius: 10px; font-size: 15px; font-family: inherit; }
  .field-input:focus { outline: none; border-color: var(--brand-teal); }
  textarea.field-input { resize: vertical; min-height: 80px; }
  .modal-actions { display: flex; gap: 10px; margin-top: 14px; }
  .modal-actions button { flex: 1; padding: 14px; border: none; border-radius: 12px; font-size: 15px; font-weight: 600; font-family: inherit; cursor: pointer; }
  .btn-confirm { background: var(--brand-navy); color: white; }
  .btn-cancel { background: #f3f4f6; color: #374151; }
  .toast { position: fixed; bottom: 30px; left: 50%; transform: translateX(-50%) translateY(80px); background: var(--brand-navy); color: white; padding: 14px 22px; border-radius: 30px; font-size: 14px; font-weight: 500; z-index: 200; transition: transform 0.3s; box-shadow: 0 8px 30px rgba(0,0,0,0.3); max-width: 90%; text-align: center; }
  .toast.show { transform: translateX(-50%) translateY(0); }
  .toast.error { background: var(--danger); }
  .loader { display: inline-block; width: 18px; height: 18px; border: 3px solid rgba(255,255,255,0.3); border-top-color: white; border-radius: 50%; animation: spin 1s linear infinite; }
  @keyframes spin { to { transform: rotate(360deg); } }
  .full-loader { position: fixed; inset: 0; background: rgba(255,255,255,0.85); display: none; align-items: center; justify-content: center; z-index: 300; }
  .full-loader.show { display: flex; }
  .full-loader .loader { width: 36px; height: 36px; border-color: rgba(10, 59, 85, 0.3); border-top-color: var(--brand-navy); }
  .err-screen { background: white; padding: 40px 24px; border-radius: 16px; text-align: center; color: var(--danger); margin-top: 60px; }
  .err-screen h1 { font-size: 22px; margin-bottom: 10px; }
  .err-screen p { color: #6b7280; }
</style>
</head>

<script>
const TOKEN = 'eyJhbGciOiJIUzI1NiJ9.eyJ0aWQiOjY1Mzg2Mzc1MCwiYWFpIjoxMSwidWlkIjoxNzUzMjcxNiwiaWFkIjoiMjAyNi0wNS0wNVQwNjowODo1OC41MzJaIiwicGVyIjoibWU6d3JpdGUiLCJhY3RpZCI6NzY5NTMzMSwicmduIjoidXNlMSJ9.QgRo3uI3ACX6f1mNupc3VdT4IzCE6HTCNtNyOUeh4jc';
const BOARD_ID = 18411499025;
const COL_EMP = 'single_selectut0yc1u';
const COL_DATE = 'datel4rhkr7r';
const COL_DAYTYPE = 'single_select6r6p4qc';
const COL_ARRIVAL = 'short_text6jb4mfyc';
const COL_END = 'short_texted6okf21';
const COL_NOTES = 'long_textitv0zu92';
const GROUP_CORRECTIONS = 'group_mm32nt2p';
const employees = [
  { idx: 0, name: 'ליאור דיטור' },
  { idx: 1, name: 'גל כהן' },
  { idx: 2, name: 'בר פרץ' },
  { idx: 3, name: 'יפעת כונקה' },
  { idx: 4, name: 'בן סולומון' },
  { idx: 5, name: 'איציק בר דוד' },
  { idx: 6, name: 'זוהדי אלנאברי' },
  { idx: 7, name: 'מוחמד והדאן' },
  { idx: 8, name: 'בר פאסי' }
];
const dayTypeNames = ['יום עבודה רגיל','יום מחלה','יום חופש','חג','מילואים'];
const params = new URLSearchParams(window.location.search);
const empIdx = parseInt(params.get('emp'));
const employee = employees[empIdx];
if (!employee) {
  document.getElementById('app').innerHTML = `<div class="err-screen"><h1>קישור לא תקין</h1><p>הקישור חסר את פרטי העובד. פנה/י למנהל לקבלת קישור אישי.</p></div>`;
}
let openSessionId = null;
function pad2(n) { return String(n).padStart(2,'0'); }
function getTodayISO() { const d=new Date(); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function getYesterdayISO() { const d = new Date(); d.setDate(d.getDate()-1); return `${d.getFullYear()}-${pad2(d.getMonth()+1)}-${pad2(d.getDate())}`; }
function getDateDisplay(iso) { if (iso) { const [y,m,dd] = iso.split('-'); return `${dd}/${m}/${y}`; } const d=new Date(); return `${pad2(d.getDate())}/${pad2(d.getMonth()+1)}/${d.getFullYear()}`; }
function getNowTime() { const d=new Date(); return `${pad2(d.getHours())}:${pad2(d.getMinutes())}`; }
function getGreeting() { const h = new Date().getHours(); if (h < 12) return 'בוקר טוב'; if (h < 17) return 'צהריים טובים'; if (h < 21) return 'ערב טוב'; return 'לילה טוב'; }
function showLoader(s) { document.getElementById('loader').classList.toggle('show', s); }
let toastTimer;
function toast(msg, isError) { const t = document.getElementById('toast'); t.textContent = msg; t.classList.toggle('error', !!isError); t.classList.add('show'); clearTimeout(toastTimer); toastTimer = setTimeout(()=>t.classList.remove('show'), 3500); }
async function callMonday(query, variables) {
  const res = await fetch('https://api.monday.com/v2', { method: 'POST', headers: { 'Content-Type': 'application/json', 'Authorization': TOKEN }, body: JSON.stringify({ query, variables }) });
  const json = await res.json();
  if (json.errors) { console.error(json.errors); throw new Error(json.errors[0]?.message || 'API error'); }
  return json.data;
}
async function findTodayItems() {
  const today = getTodayISO();
  const query = `query($boardId: ID!) { boards(ids: [$boardId]) { items_page(limit: 50, query_params: { rules: [ { column_id: "${COL_EMP}", compare_value: [${empIdx}] }, { column_id: "${COL_DATE}", compare_value: ["${today}", "EXACT"] } ], operator: and }) { items { id created_at group { id } column_values(ids: ["${COL_ARRIVAL}", "${COL_END}", "${COL_DAYTYPE}"]) { id text } } } } }`;
  const data = await callMonday(query, { boardId: BOARD_ID });
  const items = (data.boards[0].items_page.items || []).filter(i => !i.group || i.group.id !== GROUP_CORRECTIONS);
  items.sort((a, b) => new Date(a.created_at) - new Date(b.created_at));
  return items;
}
function parseHours(timeStr) { if (!timeStr || !/:/.test(timeStr)) return null; const [h, m] = timeStr.split(':').map(s => parseInt(s, 10)); if (isNaN(h) || isNaN(m)) return null; return h + m/60; }
function formatHours(h) { const whole = Math.floor(h); const mins = Math.round((h - whole) * 60); return `${whole}:${pad2(mins)}`; }
async function refreshStatus(showToastFlag) {
  if (!employee) return;
  try {
    showLoader(true);
    const items = await findTodayItems();
    const cv = (item, id) => item.column_values.find(c => c.id === id)?.text || '';
    const workSessions = []; let specialDay = null; openSessionId = null; let totalHours = 0;
    for (const item of items) {
      const arrival = cv(item, COL_ARRIVAL); const exit = cv(item, COL_END); const dayType = cv(item, COL_DAYTYPE);
      if (dayType && dayType !== 'יום עבודה רגיל') { specialDay = dayType; }
      else { if (arrival || exit) { const isOpen = arrival && !exit; if (isOpen) openSessionId = item.id; let hrs = 0; if (arrival && exit) { const ah = parseHours(arrival), eh = parseHours(exit); if (ah !== null && eh !== null) { hrs = eh - ah; totalHours += hrs; } } workSessions.push({ id: item.id, arrival, exit, isOpen, hrs }); } }
    }
    const listEl = document.getElementById('sessionList');
    if (workSessions.length === 0 && !specialDay) { listEl.innerHTML = '<div class="empty-state">אין דיווחים היום</div>'; }
    else if (workSessions.length === 0 && specialDay) { listEl.innerHTML = '<div class="empty-state">לא נדרש דיווח שעות</div>'; }
    else { listEl.innerHTML = workSessions.map((s) => `<div class="session ${s.isOpen ? 'open' : 'closed'}"><span class="session-times"><span>${s.arrival || '--:--'}</span><span class="arrow">→</span><span>${s.exit || '--:--'}</span></span>${s.isOpen ? '<span class="session-status-pill">פתוח</span>' : `<span class="session-hours">${formatHours(s.hrs)} שעות</span>`}</div>`).join(''); }
    document.getElementById('totalHours').textContent = totalHours > 0 ? `סה"כ ${formatHours(totalHours)}` : '';
    const banner = document.getElementById('specialBanner');
    if (specialDay) { banner.style.display = 'block'; banner.textContent = `דווח: ${specialDay}`; } else { banner.style.display = 'none'; }
    document.getElementById('btnIn').disabled = !!openSessionId;
    document.getElementById('btnOut').disabled = !openSessionId;
    if (showToastFlag) toast('סטטוס עודכן');
  } catch (e) { toast('שגיאה: ' + e.message, true); } finally { showLoader(false); }
}
let pendingAction = null;
function openTimeModal(title, defaultTime, action) { document.getElementById('timeModalTitle').textContent = title; document.getElementById('timeInput').value = defaultTime; pendingAction = action; document.getElementById('timeOverlay').classList.add('show'); }
function closeTimeModal() { document.getElementById('timeOverlay').classList.remove('show'); pendingAction = null; }
document.getElementById('timeConfirmBtn').addEventListener('click', async () => { const time = document.getElementById('timeInput').value; if (!time) { toast('נא לבחור שעה', true); return; } const action = pendingAction; closeTimeModal(); if (action) await action(time); });
function onMarkEntry() {
  if (!employee) return;
  if (openSessionId) { toast('יש קטע פתוח - צריך לסמן יציאה קודם', true); return; }
  openTimeModal('שעת כניסה', getNowTime(), async (time) => {
    try {
      showLoader(true);
      const itemName = `${employee.name} - ${getDateDisplay()}`;
      const colVals = JSON.stringify({ [COL_EMP]: { index: empIdx }, [COL_DATE]: { date: getTodayISO() }, [COL_DAYTYPE]: { index: 0 }, [COL_ARRIVAL]: time });
      const mutation = `mutation($boardId: ID!, $itemName: String!, $columnValues: JSON!) { create_item(board_id: $boardId, item_name: $itemName, column_values: $columnValues) { id } }`;
      await callMonday(mutation, { boardId: BOARD_ID, itemName, columnValues: colVals });
      toast(`כניסה נרשמה ב-${time}`);
      await refreshStatus();
    } catch (e) { toast('שגיאה: ' + e.message, true); } finally { showLoader(false); }
  });
}
function onMarkExit() {
  if (!employee) return;
  if (!openSessionId) { toast('אין קטע פתוח - צריך לסמן כניסה קודם', true); return; }
  const itemId = openSessionId;
  openTimeModal('שעת יציאה', getNowTime(), async (time) => {
    try {
      showLoader(true);
      const mutation = `mutation($boardId: ID!, $itemId: ID!, $columnId: String!, $value: String!) { change_simple_column_value(board_id: $boardId, item_id: $itemId, column_id: $columnId, value: $value) { id } }`;
      await callMonday(mutation, { boardId: BOARD_ID, itemId: itemId, columnId: COL_END, value: time });
      toast(`יציאה נרשמה ב-${time}`);
      await refreshStatus();
    } catch (e) { toast('שגיאה: ' + e.message, true); } finally { showLoader(false); }
  });
}
function openSpecialModal() { document.getElementById('specialOverlay').classList.add('show'); }
function closeSpecialModal() { document.getElementById('specialOverlay').classList.remove('show'); }
document.querySelectorAll('#specialOptions .opt-btn').forEach(btn => {
  btn.addEventListener('click', async () => {
    const idx = parseInt(btn.dataset.idx); const dayName = dayTypeNames[idx];
    if (!confirm(`לסמן את היום כ"${dayName}"?`)) return;
    closeSpecialModal();
    try {
      showLoader(true);
      const itemName = `${employee.name} - ${getDateDisplay()} - ${dayName}`;
      const colVals = JSON.stringify({ [COL_EMP]: { index: empIdx }, [COL_DATE]: { date: getTodayISO() }, [COL_DAYTYPE]: { index: idx } });
      const mutation = `mutation($boardId: ID!, $itemName: String!, $columnValues: JSON!) { create_item(board_id: $boardId, item_name: $itemName, column_values: $columnValues) { id } }`;
      await callMonday(mutation, { boardId: BOARD_ID, itemName, columnValues: colVals });
      toast(`נרשם: ${dayName}`);
      await refreshStatus();
    } catch (e) { toast('שגיאה: ' + e.message, true); } finally { showLoader(false); }
  });
});
function openCorrectionModal() { document.getElementById('correctionDate').value = getYesterdayISO(); document.getElementById('correctionDesc').value = ''; document.getElementById('correctionOverlay').classList.add('show'); }
function closeCorrectionModal() { document.getElementById('correctionOverlay').classList.remove('show'); }
async function submitCorrection() {
  const dateVal = document.getElementById('correctionDate').value;
  const desc = document.getElementById('correctionDesc').value.trim();
  if (!dateVal) { toast('נא לבחור תאריך', true); return; }
  if (!desc) { toast('נא לכתוב תיאור', true); return; }
  closeCorrectionModal();
  try {
    showLoader(true);
    const itemName = `בקשת תיקון - ${employee.name} - ${getDateDisplay(dateVal)}`;
    const colVals = JSON.stringify({ [COL_EMP]: { index: empIdx }, [COL_DATE]: { date: dateVal }, [COL_NOTES]: desc });
    const mutation = `mutation($boardId: ID!, $groupId: String!, $itemName: String!, $columnValues: JSON!) { create_item(board_id: $boardId, group_id: $groupId, item_name: $itemName, column_values: $columnValues) { id } }`;
    await callMonday(mutation, { boardId: BOARD_ID, groupId: GROUP_CORRECTIONS, itemName, columnValues: colVals });
    toast('הבקשה נשלחה למנהלת');
  } catch (e) { toast('שגיאה: ' + e.message, true); } finally { showLoader(false); }
}
if (employee) {
  document.getElementById('greeting').textContent = getGreeting();
  document.getElementById('empName').textContent = employee.name;
  document.getElementById('dateDisp').textContent = getDateDisplay();
  refreshStatus();
}
</script>
</body>
